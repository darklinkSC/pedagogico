{% extends "layouts/base.html" %}
{% load bootstrap %}
{% block content %}
<section class="pcoded-main-container">
    <div class="pcoded-content">
        <div class="page-header">
            <div class="page-block">
                <h5>Novo Lançamento de Pareceres por Turma</h5>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5>Selecione a Turma e Etapa</h5>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            {{ form|bootstrap }}
                            <div class="text-right mt-3">
                                <a href="{% url 'pedagogico:listagemPareceres' %}" class="btn btn-secondary mr-2">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Iniciar Digitação dos Pareceres</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
